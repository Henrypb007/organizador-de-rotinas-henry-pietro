<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henry Workflows | Organizador de Rotinas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js para os Objetos 3D Voando no Fundo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Canvas do Fundo 3D -->
  <canvas id="bg3d"></canvas>

  <!-- Cabeçalho / Navbar -->
  <header class="navbar">
    <div class="logo">HENRY<span>WORKFLOWS</span></div>
    <nav>
      <ul>
        <li><a href="#cards-container">Rotinas</a></li>
        <li><button class="btn-primary" onclick="openModal('modal-add')">+ Nova Rotina</button></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>Organize a sua vida com excelência, <span>Henry</span>.</h1>
    <p>Gestão personalizada de Estudo, Trabalho, Lazer, Hobbies, Esportes e Saúde em um único ecossistema tridimensional.</p>
  </section>

  <!-- Container dos Cards de Rotinas -->
  <main class="cards-container" id="cards-container">
    <!-- Os cards serão carregados dinamicamente aqui -->
  </main>

  <!-- Container Dinâmico de Modais -->
  <div id="modals-wrapper">
    <!-- Modal: Nova Rotina -->
    <div id="modal-add" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal('modal-add')">&times;</span>
        <h2><i data-lucide="plus-circle"></i> Criar Nova Rotina</h2>
        <hr>
        <form id="form-new-routine" onsubmit="createNewRoutine(event)">
          <div class="form-group">
            <label for="routine-title">Nome da Rotina:</label>
            <input type="text" id="routine-title" placeholder="Ex: Estudo, Musculação, Trabalho..." required>
          </div>
          <div class="form-group">
            <label for="routine-icon">Ícone / Categoria:</label>
            <select id="routine-icon">
              <option value="book-open">📚 Estudos</option>
              <option value="briefcase">💼 Trabalho</option>
              <option value="smile">😊 Lazer</option>
              <option value="gamepad-2">🎮 Hobbies</option>
              <option value="dumbbell">🏋️ Esportes</option>
              <option value="heart-pulse">❤️ Saúde</option>
              <option value="sparkles">✨ Geral / Especial</option>
              <option value="coffee">☕ Manhã / Foco</option>
              <option value="moon">🌙 Noite / Sono</option>
            </select>
          </div>
          <div class="form-group">
            <label for="routine-desc">Descrição Curta:</label>
            <input type="text" id="routine-desc" placeholder="Resumo do objetivo desta rotina..." required>
          </div>
          <div class="form-group">
            <label for="routine-items">Hábitos / Tarefas (separados por vírgula):</label>
            <textarea id="routine-items" rows="3" placeholder="Ex: Ler 20 págs, Praticar exercícios, Revisar matéria" required></textarea>
          </div>
          <button type="submit" class="btn-primary btn-block">Salvar Nova Rotina</button>
        </form>
      </div>
    </div>
  </div>

  <!-- JavaScript Embutido -->
  <script>
    // Rotinas Iniciais Padrão (Sem duplicar Estudos se você já tiver adicionado)
    const defaultRoutines = [
      {
        id: 'routine-estudo-default',
        title: 'Estudo',
        icon: 'book-open',
        desc: 'Desenvolvimento acadêmico, leitura e novos aprendizados.',
        items: ['📖 Leitura técnica (30 min)', '💻 Prática e exercícios', '📝 Revisão de anotações']
      },
      {
        id: 'routine-trabalho-default',
        title: 'Trabalho',
        icon: 'briefcase',
        desc: 'Projetos profissionais, reuniões e metas diárias.',
        items: ['📧 Resposta a e-mails', '🚀 Planejamento de tarefas', '📊 Revisão de entregas']
      },
      {
        id: 'routine-esportes-default',
        title: 'Esportes',
        icon: 'dumbbell',
        desc: 'Treinos físicos, alta performance e rotina de exercícios.',
        items: ['🏋️ Musculação / Treino de Força', '🏃 Corrida ao ar livre', '🧘 Alongamento']
      }
    ];

    // Inicialização dos Ícones Lucide
    lucide.createIcons();

    // Funções de Modal
    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.style.display = 'flex';
      }
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.style.display = 'none';
      }
    }

    // Fechar modal ao clicar fora
    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
      }
    };

    // Renderizar uma Rotina no DOM (Card + Modal)
    function renderRoutine(r) {
      // Criar Card
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${r.id}`;
      card.innerHTML = `
        <div class="card-icon"><i data-lucide="${r.icon}"></i></div>
        <h3>${r.title}</h3>
        <p>${r.desc}</p>
        <div class="card-actions">
          <button class="btn-primary" onclick="openModal('${r.id}')">Ver Detalhes</button>
          <button class="btn-delete" title="Excluir Rotina" onclick="deleteRoutine('${r.id}')">
            <i data-lucide="trash-2"></i>
          </button>
        </div>
      `;
      document.getElementById('cards-container').appendChild(card);

      // Criar Modal
      const modal = document.createElement('div');
      modal.id = r.id;
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content">
          <span class="close-btn" onclick="closeModal('${r.id}')">&times;</span>
          <h2><i data-lucide="${r.icon}"></i> ${r.title}</h2>
          <hr>
          <ul>
            ${r.items.map(item => `<li>✨ ${item}</li>`).join('')}
          </ul>
        </div>
      `;
      document.getElementById('modals-wrapper').appendChild(modal);

      lucide.createIcons();
    }

    // Criar Nova Rotina
    function createNewRoutine(event) {
      event.preventDefault();

      const title = document.getElementById('routine-title').value.trim();
      const icon = document.getElementById('routine-icon').value;
      const desc = document.getElementById('routine-desc').value.trim();
      const itemsRaw = document.getElementById('routine-items').value.trim();

      if (!title || !desc || !itemsRaw) return;

      const routineId = 'modal-custom-' + Date.now();
      const itemsList = itemsRaw.split(',').map(item => item.trim()).filter(item => item.length > 0);

      const routineData = { id: routineId, title, icon, desc, items: itemsList };

      renderRoutine(routineData);
      saveRoutine(routineData);

      document.getElementById('form-new-routine').reset();
      closeModal('modal-add');
    }

    // Excluir Rotina
    function deleteRoutine(id) {
      if (confirm('Tem certeza que deseja excluir esta rotina?')) {
        // Remover Card e Modal do DOM
        const card = document.getElementById(`card-${id}`);
        const modal = document.getElementById(id);
        if (card) card.remove();
        if (modal) modal.remove();

        // Atualizar localStorage
        let routines = getSavedRoutines();
        routines = routines.filter(r => r.id !== id);
        localStorage.setItem('henry_routines', JSON.stringify(routines));
      }
    }

    // Persistência com localStorage
    function getSavedRoutines() {
      const saved = localStorage.getItem('henry_routines');
      if (!saved) {
        // Se for a primeira vez, salva os padrões no localStorage
        localStorage.setItem('henry_routines', JSON.stringify(defaultRoutines));
        return defaultRoutines;
      }
      return JSON.parse(saved);
    }

    function saveRoutine(routineData) {
      const routines = getSavedRoutines();
      routines.push(routineData);
      localStorage.setItem('henry_routines', JSON.stringify(routines));
    }

    function loadRoutines() {
      const routines = getSavedRoutines();
      document.getElementById('cards-container').innerHTML = '';
      routines.forEach(r => renderRoutine(r));
    }

    // Carregar rotinas ao iniciar
    window.addEventListener('DOMContentLoaded', loadRoutines);

    // Script 3D com Three.js (Objetos voando no fundo)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg3d'), alpha: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const objects = [];
    const geometryList = [
      new THREE.CylinderGeometry(0.1, 0.1, 2, 8),
      new THREE.BoxGeometry(1, 1.3, 0.3),
      new THREE.TorusGeometry(0.8, 0.2, 16, 100),
      new THREE.IcosahedronGeometry(0.8)
    ];

    const materialBlue = new THREE.MeshPhongMaterial({
      color: 0x0070f3,
      emissive: 0x001133,
      specular: 0xffffff,
      shininess: 100,
      flatShading: true
    });

    const materialWhite = new THREE.MeshPhongMaterial({
      color: 0xffffff,
      emissive: 0x222222,
      specular: 0xffffff,
      shininess: 80,
      flatShading: true
    });

    for (let i = 0; i < 40; i++) {
      const geom = geometryList[Math.floor(Math.random() * geometryList.length)];
      const mat = Math.random() > 0.4 ? materialBlue : materialWhite;
      const mesh = new THREE.Mesh(geom, mat);

      mesh.position.x = (Math.random() - 0.5) * 30;
      mesh.position.y = (Math.random() - 0.5) * 30;
      mesh.position.z = (Math.random() - 0.5) * 30;

      mesh.rotation.x = Math.random() * Math.PI;
      mesh.rotation.y = Math.random() * Math.PI;

      mesh.userData = {
        rotSpeedX: (Math.random() - 0.5) * 0.02,
        rotSpeedY: (Math.random() - 0.5) * 0.02,
        floatSpeed: (Math.random() - 0.5) * 0.015
      };

      scene.add(mesh);
      objects.push(mesh);
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x0070f3, 2, 50);
    pointLight.position.set(10, 10, 10);
    scene.add(pointLight);

    const whiteLight = new THREE.PointLight(0xffffff, 1.5, 50);
    whiteLight.position.set(-10, -10, 10);
    scene.add(whiteLight);

    camera.position.z = 15;

    function animate() {
      requestAnimationFrame(animate);

      objects.forEach(obj => {
        obj.rotation.x += obj.userData.rotSpeedX;
        obj.rotation.y += obj.userData.rotSpeedY;
        obj.position.y += Math.sin(Date.now() * 0.001 + obj.position.x) * obj.userData.floatSpeed;
      });

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
